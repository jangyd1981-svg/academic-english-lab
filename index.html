<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172554">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="English Lab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Academic English Lab</title>
<style>
:root{--navy:#172554;--blue:#3156a6;--ink:#172033;--muted:#64748b;--paper:#f5f7fb;--line:#e1e7f0;--white:#fff;--green:#16794b;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;line-height:1.5}
button,input{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:650}
.app{max-width:900px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom))}
header{padding:24px 4px 18px;color:var(--navy)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}
h1{font-size:clamp(26px,5vw,36px);line-height:1.1;margin:6px 0 8px;letter-spacing:-.04em}header p{margin:0;color:var(--muted)}
.nav{display:flex;gap:8px;overflow:auto;padding:4px 0 14px;position:sticky;top:0;background:var(--paper);z-index:3}
.nav button{white-space:nowrap;background:#e8edf7;color:#30415e;padding:10px 14px}.nav button.active{background:var(--navy);color:white}
.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:clamp(16px,4vw,26px);box-shadow:0 6px 24px #14213d08;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:var(--muted)}.small{font-size:13px}.pill{display:inline-flex;align-items:center;background:#edf2ff;color:#304b8c;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:750}
.progress{height:8px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:10px 0 4px}.progress span{display:block;height:100%;background:var(--blue);width:0%;transition:width .2s}
.card{min-height:300px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:26px 18px;cursor:pointer;user-select:none;border:1px solid #dce4f1;background:linear-gradient(145deg,#fff,#f8faff);border-radius:20px}
.word{font-size:clamp(28px,6vw,42px);font-weight:800;letter-spacing:-.035em;color:var(--navy);margin:12px 0}.ipa{font-size:17px;color:var(--blue)}.hint{font-size:14px;color:var(--muted);margin-top:12px}.answer{text-align:left;border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.answer h3{font-size:14px;color:var(--muted);margin:12px 0 3px}.answer p{margin:0 0 8px}.example{background:#f3f6fc;padding:12px;border-radius:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.primary{background:var(--navy);color:white}.secondary{background:#edf1f8;color:#24334e}.good{background:#e6f5ec;color:#14643d}.bad{background:#fff0ee;color:#a12b20}.wide{width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f4f6fb;border-radius:15px;padding:14px}.stat strong{display:block;font-size:25px;color:var(--navy)}.stat span{font-size:12px;color:var(--muted)}
input[type=search]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin:8px 0 14px;background:white}
.wordlist{display:grid;gap:8px}.worditem{border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:white;text-align:left;width:100%;color:var(--ink)}.worditem strong{display:block;color:var(--navy)}.worditem span{font-size:13px;color:var(--muted)}
.notice{background:#fff8e8;border:1px solid #f1dfb2;color:#73551c;padding:12px 14px;border-radius:14px;font-size:13px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:8px 0 20px}
@media(min-width:700px){.app{padding-left:24px;padding-right:24px}.studygrid{display:grid;grid-template-columns:1fr 270px;gap:14px;align-items:start}.sidepanel{position:sticky;top:76px}.card{min-height:360px}}
</style>
</head>
<body>
<div class="app">
<header><div class="eyebrow">Daily vocabulary · 15 words</div><h1>Academic English Lab</h1><p>국제관계·정치학부터 다양한 학문 분야까지, 매일 조금씩.</p></header>
<nav class="nav" aria-label="주 메뉴">
<button class="active" data-view="study">오늘 학습</button><button data-view="review">오답 복습</button><button data-view="vocab">단어장</button><button data-view="progress">학습 기록</button>
</nav>
<main id="main"></main>
<footer>학습 기록은 이 기기의 브라우저에 저장됩니다. 브라우저 데이터 삭제 시 기록이 사라질 수 있습니다.</footer>
</div>
<script>
const WORDS = [
{term:"compellence",ipa:"/kəmˈpɛləns/",meaning:"강제 외교, 상대방에게 특정 행동을 하도록 강요하는 전략",field:"국제관계",example:"The government used economic sanctions as an instrument of compellence.",translation:"정부는 강제 외교의 수단으로 경제 제재를 사용했다.",syn:"coercion, coercive diplomacy",ant:"deterrence"},
{term:"détente",ipa:"/deɪˈtɑːnt/",meaning:"긴장 완화, 국가 간 적대 관계의 완화",field:"국제관계",example:"The two countries pursued détente after years of confrontation.",translation:"두 국가는 수년간의 대립 이후 긴장 완화를 추진했다.",syn:"thaw, easing of tensions",ant:"escalation, confrontation"},
{term:"interdependence",ipa:"/ˌɪntərdɪˈpɛndəns/",meaning:"상호의존, 행위자들이 서로에게 의존하는 상태",field:"국제정치경제",example:"Economic interdependence can raise the costs of conflict.",translation:"경제적 상호의존은 분쟁의 비용을 높일 수 있다.",syn:"mutual dependence, reciprocity",ant:"independence, self-sufficiency"},
{term:"multipolarity",ipa:"/ˌmʌltiˌpoʊˈlærəti/",meaning:"다극성, 국제체제에 여러 강대국 중심이 존재하는 구조",field:"국제관계",example:"Some analysts argue that multipolarity creates new uncertainties.",translation:"일부 분석가들은 다극성이 새로운 불확실성을 낳는다고 주장한다.",syn:"multi-power structure",ant:"unipolarity"},
{term:"strategic ambiguity",ipa:"/strəˈtiːdʒɪk ˌæmbɪˈɡjuːəti/",meaning:"전략적 모호성, 의도나 대응을 명확히 밝히지 않는 전략",field:"안보연구",example:"Strategic ambiguity may discourage unilateral changes to the status quo.",translation:"전략적 모호성은 현상태를 일방적으로 변경하려는 시도를 억제할 수 있다.",syn:"deliberate ambiguity, calculated uncertainty",ant:"strategic clarity"},
{term:"collective action problem",ipa:"/kəˈlɛktɪv ˈækʃən ˌprɑːbləm/",meaning:"집합행동 문제, 공동의 이익이 있어도 개인의 무임승차 때문에 협력이 어려운 상황",field:"정치학",example:"Climate change is a classic collective action problem.",translation:"기후변화는 전형적인 집합행동 문제이다.",syn:"cooperation dilemma, free-rider problem",ant:"—"},
{term:"principal-agent problem",ipa:"/ˈprɪnsəpəl ˈeɪdʒənt ˌprɑːbləm/",meaning:"주인-대리인 문제, 대리인이 주인의 이익과 다르게 행동할 수 있는 문제",field:"정치학·행정학",example:"Monitoring can reduce the principal-agent problem in public agencies.",translation:"감독은 공공기관의 주인-대리인 문제를 줄일 수 있다.",syn:"agency problem, delegation problem",ant:"—"},
{term:"moral hazard",ipa:"/ˌmɔːrəl ˈhæzərd/",meaning:"도덕적 해이, 위험 부담을 다른 사람이 지게 되어 위험한 행동을 더 쉽게 하는 현상",field:"정치경제",example:"A bailout may create moral hazard if firms expect future rescue.",translation:"기업들이 향후 구제를 기대한다면 구제금융은 도덕적 해이를 초래할 수 있다.",syn:"risk-shifting, incentive distortion",ant:"—"},
{term:"rent-seeking",ipa:"/ˈrɛnt ˌsiːkɪŋ/",meaning:"지대 추구, 생산적 활동보다 특혜나 독점적 이익을 얻는 데 자원을 쓰는 행위",field:"정치경제",example:"The regulation created opportunities for rent-seeking by powerful firms.",translation:"그 규제는 유력 기업들이 지대를 추구할 기회를 만들었다.",syn:"privilege-seeking, lobbying for special favors",ant:"value creation"},
{term:"state capacity",ipa:"/steɪt kəˈpæsəti/",meaning:"국가 역량, 국가가 정책을 설계하고 집행하며 공공재를 제공할 능력",field:"비교정치",example:"State capacity affects whether governments can implement reforms.",translation:"국가 역량은 정부가 개혁을 실행할 수 있는지에 영향을 미친다.",syn:"government capacity, administrative capacity",ant:"state weakness"},
{term:"political efficacy",ipa:"/pəˈlɪtɪkəl ɪˈfɪkəsi/",meaning:"정치 효능감, 정치에 영향을 미칠 수 있다고 느끼는 개인의 믿음",field:"정치행태",example:"Higher political efficacy is often associated with greater participation.",translation:"정치 효능감이 높을수록 정치 참여가 활발한 경우가 많다.",syn:"perceived political influence",ant:"political powerlessness"},
{term:"agenda-setting",ipa:"/əˈdʒɛndə ˌsɛtɪŋ/",meaning:"의제 설정, 어떤 문제가 공적 논의와 정책 결정의 대상이 되도록 만드는 과정",field:"정책학·미디어",example:"News coverage can influence agenda-setting during an election.",translation:"뉴스 보도는 선거 기간의 의제 설정에 영향을 미칠 수 있다.",syn:"issue prioritization, agenda formation",ant:"—"},
{term:"policy feedback",ipa:"/ˈpɑːləsi ˈfiːdbæk/",meaning:"정책 피드백, 기존 정책이 이후의 정치적 이해관계·태도·정책 선택에 미치는 영향",field:"정책학",example:"Welfare programs can generate policy feedback by shaping voter expectations.",translation:"복지 프로그램은 유권자의 기대를 형성함으로써 정책 피드백을 일으킬 수 있다.",syn:"policy effects on politics",ant:"—"},
{term:"bureaucratic inertia",ipa:"/ˌbjʊrəˈkrætɪk ɪˈnɜːrʃə/",meaning:"관료적 관성, 조직이 기존 절차와 관행에서 벗어나기 어려운 현상",field:"행정학",example:"Bureaucratic inertia delayed the implementation of the new policy.",translation:"관료적 관성으로 인해 새 정책의 시행이 지연되었다.",syn:"organizational inertia, institutional rigidity",ant:"organizational adaptability"},
{term:"separation of powers",ipa:"/ˌsɛpəˈreɪʃən əv ˈpaʊərz/",meaning:"권력분립, 국가 권력을 여러 기관에 나누어 상호 견제하게 하는 원리",field:"헌정정치",example:"The separation of powers is designed to prevent the concentration of authority.",translation:"권력분립은 권력이 한곳에 집중되는 것을 막기 위해 고안되었다.",syn:"division of powers, checks and balances (related)",ant:"concentration of power"},
{term:"hegemony",ipa:"/hɪˈdʒɛməni/",meaning:"패권, 한 국가나 행위자가 체제에서 압도적인 영향력을 행사하는 상태",field:"국제관계",example:"The debate concerns whether the rising power will challenge regional hegemony.",translation:"그 논쟁은 부상하는 강대국이 지역 패권에 도전할 것인지에 관한 것이다.",syn:"dominance, primacy",ant:"subordination"},
{term:"revisionism",ipa:"/rɪˈvɪʒəˌnɪzəm/",meaning:"현상 변경주의, 기존 국제질서나 규칙을 바꾸려는 지향",field:"국제관계",example:"Revisionism should be assessed through a state's goals and behavior.",translation:"현상 변경주의는 국가의 목표와 행동을 통해 평가해야 한다.",syn:"status-quo revision, order-changing ambition",ant:"status quo orientation"},
{term:"bandwagoning",ipa:"/ˈbændˌwæɡənɪŋ/",meaning:"편승, 위협적이거나 강력한 국가 편에 합류하는 전략",field:"안보연구",example:"A small state may choose bandwagoning when balancing seems too costly.",translation:"균형 전략의 비용이 너무 크다고 판단하면 약소국은 편승을 선택할 수 있다.",syn:"alignment with the stronger power",ant:"balancing"},
{term:"buck-passing",ipa:"/ˈbʌk ˌpæsɪŋ/",meaning:"책임 전가, 위협에 대응하는 부담을 다른 국가가 지도록 하는 전략",field:"안보연구",example:"Buck-passing allows a state to avoid the immediate costs of balancing.",translation:"책임 전가는 국가가 균형 전략의 즉각적인 비용을 피하게 해준다.",syn:"burden-shifting, responsibility shifting",ant:"burden-sharing"},
{term:"entrapment",ipa:"/ɪnˈtræpmənt/",meaning:"연루의 위험, 동맹국의 행동 때문에 원치 않는 분쟁에 끌려 들어갈 위험",field:"안보연구",example:"Policymakers worry that a security commitment could lead to entrapment.",translation:"정책결정자들은 안보 공약이 원치 않는 분쟁에 연루되는 결과를 낳을까 우려한다.",syn:"unwanted alliance involvement",ant:"abandonment (related risk)"},
{term:"free-riding",ipa:"/ˌfriː ˈraɪdɪŋ/",meaning:"무임승차, 비용을 부담하지 않으면서 공동의 이익을 누리는 행위",field:"정치경제",example:"Alliances may struggle when members engage in free-riding.",translation:"동맹 구성원들이 무임승차를 하면 동맹은 어려움에 직면할 수 있다.",syn:"benefiting without contributing",ant:"burden-sharing"},
{term:"audience costs",ipa:"/ˈɔːdiəns kɔːsts/",meaning:"청중 비용, 공약을 번복했을 때 국내 청중에게 치러야 하는 정치적 비용",field:"국제관계",example:"Leaders may avoid backing down because of potential audience costs.",translation:"지도자들은 잠재적 청중 비용 때문에 물러서기를 피할 수 있다.",syn:"domestic reputational costs",ant:"—"},
{term:"signaling",ipa:"/ˈsɪɡnəlɪŋ/",meaning:"신호 보내기, 의도나 결의를 상대방에게 전달하는 행동",field:"국제관계",example:"A costly signal may make a state's commitment more credible.",translation:"비용이 수반되는 신호는 국가의 공약을 더 신뢰할 만하게 만들 수 있다.",syn:"communication of intent, strategic signaling",ant:"concealment"},
{term:"commitment problem",ipa:"/kəˈmɪtmənt ˌprɑːbləm/",meaning:"공약 문제, 미래에 약속을 지킬 유인이 없어 신뢰할 만한 약속이 어려운 상황",field:"국제관계",example:"A commitment problem can make a negotiated settlement unstable.",translation:"공약 문제는 협상 타결을 불안정하게 만들 수 있다.",syn:"credible-commitment problem",ant:"credible commitment"},
{term:"regime complexity",ipa:"/reɪˈʒiːm kəmˈplɛksəti/",meaning:"레짐 복합성, 한 분야에서 여러 국제제도·규칙이 겹치고 상호작용하는 상태",field:"글로벌 거버넌스",example:"Regime complexity can create opportunities for forum shopping.",translation:"레짐 복합성은 포럼 쇼핑의 기회를 만들 수 있다.",syn:"institutional overlap, fragmented governance",ant:"institutional coherence"},
{term:"corporatism",ipa:"/ˈkɔːrpərətɪzəm/",meaning:"조합주의, 국가가 조직된 이익집단을 제도적으로 통합해 정책 결정에 참여시키는 체제",field:"비교정치",example:"Corporatism structures bargaining between the state and organized interests.",translation:"조합주의는 국가와 조직된 이익집단 사이의 협상 구조를 형성한다.",syn:"organized interest intermediation",ant:"pluralism (contrast)"},
{term:"federalism",ipa:"/ˈfɛdəˌrəlɪzəm/",meaning:"연방주의, 헌법에 따라 권한을 중앙정부와 구성 단위 정부가 나누는 체제",field:"비교정치",example:"Federalism divides authority between national and subnational governments.",translation:"연방주의는 중앙정부와 하위 정부 사이에 권한을 분배한다.",syn:"federal system, shared sovereignty",ant:"unitary system"},
{term:"electoral volatility",ipa:"/ɪˈlɛktərəl ˌvɑːləˈtɪləti/",meaning:"선거 변동성, 선거 사이에 정당별 득표율이 크게 변하는 정도",field:"선거 연구",example:"High electoral volatility may indicate weak party-system institutionalization.",translation:"높은 선거 변동성은 정당체제의 제도화가 약함을 시사할 수 있다.",syn:"vote volatility, electoral change",ant:"electoral stability"},
{term:"process tracing",ipa:"/ˈprɑːsɛs ˌtreɪsɪŋ/",meaning:"과정추적, 사례 내 증거를 분석해 원인과 결과를 잇는 인과 메커니즘을 검토하는 방법",field:"연구방법론",example:"Process tracing helps identify the causal mechanisms linking decisions to outcomes.",translation:"과정추적은 결정과 결과를 연결하는 인과 메커니즘을 식별하는 데 도움을 준다.",syn:"causal-process analysis",ant:"—"},
{term:"selection bias",ipa:"/sɪˈlɛkʃən baɪəs/",meaning:"선택 편향, 사례나 표본이 체계적으로 선택되어 추론이 왜곡되는 문제",field:"연구방법론",example:"Selection bias can undermine estimates of a policy's effectiveness.",translation:"선택 편향은 정책 효과 추정의 타당성을 훼손할 수 있다.",syn:"sample-selection bias",ant:"representative sampling (related safeguard)"},
{term:"scope conditions",ipa:"/skoʊp kənˈdɪʃənz/",meaning:"적용 범위 조건, 이론이나 인과 주장이 성립하는 범위와 조건",field:"연구방법론",example:"The author should specify the scope conditions of the argument.",translation:"저자는 해당 주장의 적용 범위 조건을 명시해야 한다.",syn:"boundary conditions, applicability conditions",ant:"unrestricted generalization"}
 ,
{term:"falsifiability",ipa:"/ˌfɔːlsɪfaɪəˈbɪləti/",meaning:"반증 가능성, 관찰이나 증거를 통해 틀렸음을 보일 수 있는 성질",field:"연구방법론",example:"Falsifiability helps distinguish testable theories from vague claims.",translation:"반증 가능성은 검증 가능한 이론과 모호한 주장을 구별하는 데 도움을 준다.",syn:"testability, refutability",ant:"untestability"},
{term:"operationalization",ipa:"/əˌpɛrəˌʃənələˈzeɪʃən/",meaning:"조작화, 추상적 개념을 관찰·측정 가능한 지표로 바꾸는 과정",field:"연구방법론",example:"The operationalization of political trust varies across studies.",translation:"정치적 신뢰의 조작화 방식은 연구마다 다르다.",syn:"measurement design, specification",ant:"conceptual vagueness"},
{term:"endogeneity",ipa:"/ˌɛndoʊdʒəˈneɪəti/",meaning:"내생성, 설명변수가 오차항과 상관되어 추정에 편향이 생기는 문제",field:"연구방법론",example:"The authors use an instrumental variable to address endogeneity.",translation:"저자들은 내생성 문제를 다루기 위해 도구변수를 사용한다.",syn:"regressor-error correlation",ant:"exogeneity"},
{term:"external validity",ipa:"/ɪkˈstɜːrnəl vəˈlɪdəti/",meaning:"외적 타당성, 연구 결과를 다른 집단·상황·시기로 일반화할 수 있는 정도",field:"연구방법론",example:"The small sample raises questions about external validity.",translation:"작은 표본은 외적 타당성에 의문을 제기한다.",syn:"generalizability, transferability",ant:"limited generalizability"},
{term:"path dependence",ipa:"/ˈpæθ dɪˌpɛndəns/",meaning:"경로 의존성, 초기 선택과 과거의 제도가 이후 선택지를 제약하는 현상",field:"비교정치",example:"Path dependence can make institutional reform difficult.",translation:"경로 의존성은 제도 개혁을 어렵게 만들 수 있다.",syn:"historical lock-in, increasing returns",ant:"path independence"},
{term:"institutionalization",ipa:"/ˌɪnstɪˌtuːʃənələˈzeɪʃən/",meaning:"제도화, 규칙과 관행이 안정적이고 지속적인 구조로 정착하는 과정",field:"비교정치",example:"Party institutionalization can improve electoral predictability.",translation:"정당 제도화는 선거 결과의 예측 가능성을 높일 수 있다.",syn:"institution-building, routinization",ant:" deinstitutionalization"},
{term:"securitization",ipa:"/sɪˌkjʊrətəˈzeɪʃən/",meaning:"안보화, 어떤 문제를 실존적 위협으로 규정해 특별 조치를 정당화하는 과정",field:"안보연구",example:"Securitization can move migration from routine politics into emergency politics.",translation:"안보화는 이주 문제를 일상 정치에서 비상 정치로 옮길 수 있다.",syn:"threat framing, emergency framing",ant:"desecuritization"},
{term:"deterrence",ipa:"/dɪˈtɜːrəns/",meaning:"억제, 상대방이 특정 행동을 하지 않도록 비용이나 위험을 부과하겠다고 위협하는 전략",field:"안보연구",example:"Credible deterrence depends on both capability and resolve.",translation:"신뢰할 수 있는 억제는 능력과 결의 모두에 달려 있다.",syn:"disincentive strategy, prevention by threat",ant:"compellence"},
{term:"balancing",ipa:"/ˈbælənsɪŋ/",meaning:"균형, 위협적인 강대국에 맞서 자체 역량을 강화하거나 동맹을 맺는 전략",field:"국제관계",example:"External balancing often involves forming alliances.",translation:"외적 균형은 흔히 동맹 형성을 수반한다.",syn:"countervailing alignment, coalition-building",ant:"bandwagoning"},
{term:"soft power",ipa:"/ˌsɔːft ˈpaʊər/",meaning:"소프트 파워, 강압이나 보상보다 매력과 정당성을 통해 원하는 결과를 얻는 능력",field:"국제관계",example:"Cultural diplomacy may strengthen a country's soft power.",translation:"문화 외교는 한 국가의 소프트 파워를 강화할 수 있다.",syn:"attraction, persuasive influence",ant:"hard power"},
{term:"economic statecraft",ipa:"/ˌiːkəˈnɑːmɪk ˈsteɪtkræft/",meaning:"경제 국책 수단 활용, 외교·안보 목표를 위해 무역·투자·제재 등을 사용하는 것",field:"국제정치경제",example:"Economic statecraft can include sanctions, aid, and investment screening.",translation:"경제적 국책 수단에는 제재, 원조, 투자 심사가 포함될 수 있다.",syn:"economic diplomacy, geoeconomic policy",ant:"—"},
{term:"policy diffusion",ipa:"/ˈpɑːləsi dɪˈfjuːʒən/",meaning:"정책 확산, 한 정부의 정책이 다른 정부의 채택 결정에 영향을 미치는 과정",field:"정책학",example:"Policy diffusion can occur through learning, competition, or emulation.",translation:"정책 확산은 학습, 경쟁 또는 모방을 통해 일어날 수 있다.",syn:"policy transfer, policy emulation",ant:"policy isolation"},
{term:"veto player",ipa:"/ˈviːtoʊ ˌpleɪər/",meaning:"거부권 행사자, 현상 변경을 위해 동의가 필요한 행위자",field:"비교정치",example:"More veto players can make major policy change more difficult.",translation:"거부권 행사자가 많을수록 주요 정책 변화가 어려워질 수 있다.",syn:"blocking actor, veto actor",ant:"—"},
{term:"political legitimacy",ipa:"/pəˈlɪtɪkəl lɪˈdʒɪtəməsi/",meaning:"정치적 정당성, 통치 권위가 적절하고 받아들일 만하다고 인정되는 정도",field:"정치이론",example:"Political legitimacy can affect voluntary compliance with state rules.",translation:"정치적 정당성은 국가 규칙에 대한 자발적 준수에 영향을 미칠 수 있다.",syn:"rightfulness, accepted authority",ant:"illegitimacy"},
{term:"credible commitment",ipa:"/ˈkrɛdəbəl kəˈmɪtmənt/",meaning:"신뢰할 수 있는 공약, 약속을 지킬 유인이 있어 상대방이 믿을 수 있는 약속",field:"정치경제·국제관계",example:"Independent institutions may help governments make credible commitments.",translation:"독립적인 제도는 정부가 신뢰할 수 있는 공약을 제시하도록 도울 수 있다.",syn:"reliable pledge, enforceable commitment",ant:"cheap talk"}
]; 
const KEY="academicEnglishLab.v1";
const DAY_MS=86400000;
function localDate(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fresh(){return {startDate:localDate(),ratings:{},seen:{},missed:[],history:{},streakDates:[],lastStudyDate:null}}
function load(){try{return {...fresh(),...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){return fresh()}}
let state=load(),view="study",idx=0,revealed=false,search="";
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function dayNo(){let start=new Date((state.startDate||localDate())+"T00:00:00");let now=new Date(localDate()+"T00:00:00");return Math.max(1,Math.floor((now-start)/DAY_MS)+1)}
function todayWords(){let day=dayNo();return WORDS.slice(((day-1)*15)%WORDS.length,((day-1)*15)%WORDS.length+15).length?WORDS.slice(((day-1)*15)%WORDS.length,((day-1)*15)%WORDS.length+15):WORDS.slice(0,15)}
function key(w){return w.term.toLowerCase()}
function todayDone(){return todayWords().filter(w=>state.ratings[localDate()+":"+key(w)]).length}
function allLearned(){return Object.keys(state.ratings).filter(k=>state.ratings[k]==="known").length}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function headerStats(){return `<div class="stats"><div class="stat"><strong>${todayDone()}/15</strong><span>오늘 완료</span></div><div class="stat"><strong>${state.missed.length}</strong><span>오답 복습 대기</span></div><div class="stat"><strong>${allLearned()}</strong><span>알고 있어요 누적</span></div></div><div class="progress"><span style="width:${todayDone()/15*100}%"></span></div><div class="small muted">Day ${dayNo()} · ${localDate()} · 오늘 학습 목표 15개</div>`}
function renderStudy(){let ws=todayWords();idx=Math.min(idx,ws.length-1);let w=ws[idx];let rated=!!state.ratings[localDate()+":"+key(w)];return `<div class="panel">${headerStats()}</div><div class="studygrid"><section class="panel"><div class="row"><span class="pill">${escapeHtml(w.field)}</span><span class="small muted">${idx+1} / ${ws.length}</span></div><div class="card" id="flashcard" role="button" tabindex="0" aria-label="카드를 눌러 뜻 보기"><div class="small muted">ACADEMIC VOCABULARY</div><div class="word">${escapeHtml(w.term)}</div><div class="ipa">${escapeHtml(w.ipa)}</div><div class="hint">${revealed?"":"카드를 누르면 뜻과 예문이 나타납니다"}</div>${revealed?`<div class="answer"><h3>한국어 뜻</h3><p>${escapeHtml(w.meaning)}</p><h3>예문</h3><p class="example">${escapeHtml(w.example)}<br><span class="muted">${escapeHtml(w.translation)}</span></p><h3>유의어</h3><p>${escapeHtml(w.syn)}</p><h3>반의어 / 대조 개념</h3><p>${escapeHtml(w.ant)}</p></div>`:""}</div><div class="actions"><button class="secondary" id="prev" ${idx===0?"disabled":""}>← 이전</button><button class="secondary" id="next">${idx===ws.length-1?"오늘 끝내기":"다음 →"}</button></div><div class="actions"><button class="good" id="known">✓ 알고 있어요</button><button class="bad" id="missed">× 다시 복습</button></div><p class="small muted">${rated?"오늘 이 단어의 학습 기록이 있습니다. 다시 평가하면 기록이 갱신됩니다.":"단어를 평가하면 오늘의 진도와 복습 목록에 반영됩니다."}</p></section><aside class="panel sidepanel"><h3 style="margin-top:0">학습 팁</h3><p class="small">1. 영어 단어를 보고 뜻을 떠올려 보세요.</p><p class="small">2. 카드를 눌러 IPA·뜻·예문을 확인하세요.</p><p class="small">3. 모르는 단어는 <b>다시 복습</b>으로 저장하세요.</p><div class="notice">기록은 이 기기의 Safari에 저장됩니다. 다른 기기나 브라우저와 자동 동기화되지 않습니다.</div></aside></div>`}
function renderReview(){let ws=WORDS.filter(w=>state.missed.includes(key(w)));if(!ws.length)return `<div class="panel"><h2>오답 복습</h2><p>현재 복습할 오답이 없습니다. 오늘 학습에서 모르는 단어를 <b>× 다시 복습</b>으로 표시해 보세요.</p><button class="primary" id="gotoStudy">오늘 학습으로</button></div>`;let w=ws[Math.min(idx,ws.length-1)];return `<div class="panel"><div class="row"><h2>오답 복습</h2><span class="pill">${idx+1} / ${ws.length}</span></div><div class="card" id="flashcard"><div class="word">${escapeHtml(w.term)}</div><div class="ipa">${escapeHtml(w.ipa)}</div>${revealed?`<div class="answer"><h3>한국어 뜻</h3><p>${escapeHtml(w.meaning)}</p><h3>예문</h3><p class="example">${escapeHtml(w.example)}<br><span class="muted">${escapeHtml(w.translation)}</span></p><h3>유의어</h3><p>${escapeHtml(w.syn)}</p><h3>반의어 / 대조 개념</h3><p>${escapeHtml(w.ant)}</p></div>`:`<div class="hint">카드를 눌러 뜻 확인</div>`}</div><div class="actions"><button class="secondary" id="prev">← 이전</button><button class="secondary" id="next">다음 →</button></div><div class="actions"><button class="good" id="known">✓ 이제 알아요</button><button class="bad" id="missed">× 다시 복습</button></div></div>`}
function renderVocab(){let ws=WORDS.filter(w=>(w.term+" "+w.meaning+" "+w.field).toLowerCase().includes(search.toLowerCase()));return `<div class="panel"><h2>전체 단어장</h2><p class="muted small">현재 ${WORDS.length}개 단어 · 검색해서 뜻과 예문을 확인하세요.</p><input id="search" type="search" placeholder="영어 단어, 한국어 뜻, 분야 검색" value="${escapeHtml(search)}"><div class="wordlist">${ws.map(w=>`<button class="worditem" data-term="${escapeHtml(w.term)}"><strong>${escapeHtml(w.term)} <span style="font-weight:400"> ${escapeHtml(w.ipa)}</span></strong><span>${escapeHtml(w.meaning)} · ${escapeHtml(w.field)}</span></button>`).join("")||"<p>검색 결과가 없습니다.</p>"}</div></div>`}
function renderProgress(){let dates=Object.keys(state.history).sort().reverse();let total=Object.keys(state.ratings).length;return `<div class="panel"><h2>학습 기록</h2><div class="stats"><div class="stat"><strong>${total}</strong><span>평가한 학습 기록</span></div><div class="stat"><strong>${allLearned()}</strong><span>알고 있어요 누적</span></div><div class="stat"><strong>${state.missed.length}</strong><span>복습 대기</span></div></div><h3>날짜별 기록</h3>${dates.length?`<div class="wordlist">${dates.map(d=>`<div class="worditem"><strong>${d}</strong><span>평가 ${state.history[d].done||0}개 · 알고 있어요 ${state.history[d].known||0}개 · 복습 ${state.history[d].missed||0}개</span></div>`).join("")}</div>`:"<p class='muted'>아직 기록이 없습니다. 플래시카드를 학습해 보세요.</p>"}<hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>기록 백업</h3><p class="small muted">기록을 JSON 파일로 내보내거나, 이전에 내보낸 기록을 가져올 수 있습니다.</p><div class="actions"><button class="secondary" id="export">기록 내보내기</button><button class="secondary" id="importBtn">기록 가져오기</button></div><input type="file" id="importFile" accept="application/json" hidden><button class="bad wide" style="margin-top:12px" id="reset">학습 기록 초기화</button></div>`}
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));let main=document.getElementById("main");main.innerHTML=view==="study"?renderStudy():view==="review"?renderReview():view==="vocab"?renderVocab():renderProgress();bind()}
function rate(known){let ws=view==="review"?WORDS.filter(w=>state.missed.includes(key(w))):todayWords();let w=ws[Math.min(idx,ws.length-1)];if(!w)return;let d=localDate(),k=d+":"+key(w);state.ratings[k]=known?"known":"missed";state.seen[key(w)]=true;if(known)state.missed=state.missed.filter(x=>x!==key(w));else if(!state.missed.includes(key(w)))state.missed.push(key(w));state.history[d]=state.history[d]||{done:0,known:0,missed:0};let dayEntries=Object.keys(state.ratings).filter(x=>x.startsWith(d+":"));state.history[d]={done:dayEntries.length,known:dayEntries.filter(x=>state.ratings[x]==="known").length,missed:dayEntries.filter(x=>state.ratings[x]==="missed").length};state.lastStudyDate=d;save();revealed=false;let count=(view==="review"?WORDS.filter(x=>state.missed.includes(key(x))):todayWords()).length;if(count)idx=Math.min(idx,count-1);render()}
function bind(){let card=document.getElementById("flashcard");if(card){let flip=()=>{revealed=!revealed;render()};card.addEventListener("click",flip);card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}})}let prev=document.getElementById("prev");if(prev)prev.onclick=()=>{idx=Math.max(0,idx-1);revealed=false;render()};let next=document.getElementById("next");if(next)next.onclick=()=>{let n=view==="review"?WORDS.filter(w=>state.missed.includes(key(w))).length:todayWords().length;if(idx>=n-1){idx=0;revealed=false;if(view==="study")alert("오늘 카드에 도달했습니다. 오답 복습이나 단어장을 이용해 보세요.");else render()}else{idx++;revealed=false;render()}};let known=document.getElementById("known");if(known)known.onclick=()=>rate(true);let missed=document.getElementById("missed");if(missed)missed.onclick=()=>rate(false);let go=document.getElementById("gotoStudy");if(go)go.onclick=()=>{view="study";idx=0;revealed=false;render()};let s=document.getElementById("search");if(s)s.oninput=()=>{search=s.value;let pos=s.selectionStart;render();let el=document.getElementById("search");el.focus();el.setSelectionRange(pos,pos)};document.querySelectorAll("[data-term]").forEach(b=>b.onclick=()=>{let w=WORDS.find(x=>x.term===b.dataset.term);alert(`${w.term} ${w.ipa}\n\n뜻: ${w.meaning}\n\n예문: ${w.example}\n${w.translation}\n\n유의어: ${w.syn}\n반의어/대조: ${w.ant}`)});let ex=document.getElementById("export");if(ex)ex.onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="academic-english-lab-progress.json";a.click();URL.revokeObjectURL(a.href)};let ib=document.getElementById("importBtn");if(ib)ib.onclick=()=>document.getElementById("importFile").click();let fi=document.getElementById("importFile");if(fi)fi.onchange=async()=>{try{let obj=JSON.parse(await fi.files[0].text());if(!obj||typeof obj!=="object"||!obj.ratings)throw Error();state={...fresh(),...obj};save();render();alert("기록을 가져왔습니다.")}catch(e){alert("올바른 Academic English Lab 백업 파일이 아닙니다.")}};let reset=document.getElementById("reset");if(reset)reset.onclick=()=>{if(confirm("이 기기에 저장된 학습 기록을 모두 초기화할까요?")){state=fresh();save();idx=0;revealed=false;render()}}}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{view=b.dataset.view;idx=0;revealed=false;render()}));
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
render();
</script>
</body></html>
